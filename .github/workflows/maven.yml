name: Java CI

on:
  push:
  pull_request:
  schedule: [ cron: '4 3 * * 5' ]

jobs:
  build:
    strategy:
      matrix:
        jdk: [ 21, 25 ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.jdk }}
          cache: 'maven'

      - run: mvn --batch-mode --show-version --no-transfer-progress -DCI=GitHub install
