quarkus:
  wiremock:
    devservices:
      extension-scanning-enabled: true
  rest-client:
    logging:
      scope: request-response
    hellos:
      uri: http://localhost:${quarkus.port}
    names:
      uri: http://localhost:${quarkus.wiremock.devservices.port}
  log:
    category:
      "org.jboss.resteasy.reactive.client.logging":
        level: DEBUG
      "org.jboss.resteasy.reactive.server.handlers":
        level: DEBUG
      "io.quarkiverse.wiremock":
        level: DEBUG
